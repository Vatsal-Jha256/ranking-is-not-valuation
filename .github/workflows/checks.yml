name: Check workshop artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r reproducibility/requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install "requests>=2.31,<3" "openpyxl>=3.1,<4"
      - run: python reproducibility/generate_manifest.py verify --allow-missing-raw
      - run: python tests/test_smoke.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python reproducibility/check_results.py
